name: "CI/CD"

on:
  push:
    branches:
      - main # (Change to master if you kept the old branch name)
  pull_request:
  workflow_dispatch:

jobs:
  # JOB 0: Load the feature/baseImage test matrix from the single source of
  # truth (test-matrix.json) so it does not have to be duplicated here.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.expand.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: "Expand test matrix"
        id: expand
        run: echo "matrix=$(bash ./scripts/expand-test-matrix.sh)" >> "$GITHUB_OUTPUT"

  # JOB 1: Run the tests in a matrix loaded from test-matrix.json
  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: "Install Dev Container CLI"
        run: |
          curl -fsSL https://raw.githubusercontent.com/devcontainers/cli/main/scripts/install.sh | sh
          echo "$HOME/.devcontainers/bin" >> "$GITHUB_PATH"

      - name: "Run tests for '${{ matrix.feature }}' against '${{ matrix.baseImage }}'"
        run: |
          if [ "${{ matrix.skipScenarios }}" = "true" ]; then
            devcontainer features test -f "${{ matrix.feature }}" -i "${{ matrix.baseImage }}" --skip-scenarios
          else
            devcontainer features test -f "${{ matrix.feature }}" -i "${{ matrix.baseImage }}"
          fi

  # JOB 2: Publish the feature (ONLY if tests pass AND we are on the main branch)
  deploy:
    needs: [test] # <-- THIS IS THE MAGIC LINE
    if: ${{ github.ref == 'refs/heads/main' }} # (Change to master if needed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: "Publish Features"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}